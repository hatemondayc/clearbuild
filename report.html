<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매물 맞춤 리포트 신청 · CLEARBUILD</title>
<meta name="description" content="관심 매물의 호가에 분담금·금융비까지 더한 '진짜 총투입비' 리포트를 맞춤 발급해 드립니다. 3만원.">
<meta name="robots" content="noindex">
<style>
  :root{
    --ink:#0f172a; --sub:#475569; --line:#e2e8f0; --bg:#f8fafc;
    --brand:#1d4ed8; --brand-d:#1e40af; --ok:#047857; --err:#b91c1c;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
       color:var(--ink);background:var(--bg);line-height:1.6;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:28px 20px 64px}
  .top{font-size:13px;color:var(--sub)}
  .top a{color:var(--brand);text-decoration:none}
  h1{font-size:24px;line-height:1.35;margin:18px 0 8px;letter-spacing:-.02em}
  .lead{color:var(--sub);font-size:15px;margin:0 0 20px}
  .price{display:inline-flex;align-items:center;gap:8px;background:#eff6ff;color:var(--brand-d);
         border:1px solid #bfdbfe;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;margin-bottom:22px}
  .price b{font-size:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 20px;
        box-shadow:0 1px 2px rgba(15,23,42,.04)}
  label{display:block;font-size:14px;font-weight:600;margin:16px 0 6px}
  label:first-of-type{margin-top:0}
  .req{color:var(--err);font-weight:700}
  input[type=text],input[type=email],input[type=tel]{
    width:100%;padding:12px 13px;font-size:16px;border:1px solid var(--line);border-radius:10px;
    background:#fff;color:var(--ink);outline:none}
  input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(29,78,216,.12)}
  .hint{font-size:12px;color:var(--sub);margin-top:5px}
  .err-msg{font-size:12.5px;color:var(--err);margin-top:5px;min-height:1px}
  input.invalid{border-color:var(--err)}
  .consent{display:flex;gap:10px;align-items:flex-start;margin-top:20px;font-size:13.5px;color:var(--sub)}
  .consent input{margin-top:3px;width:18px;height:18px;flex:0 0 auto}
  .btn{width:100%;margin-top:22px;padding:15px;font-size:16px;font-weight:700;color:#fff;
       background:var(--brand);border:none;border-radius:12px;cursor:pointer;transition:background .15s}
  .btn:hover{background:var(--brand-d)}
  .btn:disabled{background:#94a3b8;cursor:default}
  .form-msg{margin-top:16px;padding:13px 15px;border-radius:10px;font-size:14px;font-weight:600;display:none}
  .form-msg.ok{display:block;background:#ecfdf5;color:var(--ok);border:1px solid #a7f3d0}
  .form-msg.err{display:block;background:#fef2f2;color:var(--err);border:1px solid #fecaca}
  .foot{font-size:12px;color:var(--sub);margin-top:22px;text-align:center}
</style>
<script defer src="https://cloud.umami.is/script.js" data-website-id="1747d3d8-aa53-4000-bdfb-79c51fb639f9"></script>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="/index.html">← CLEARBUILD 홈</a></div>

  <h1>이 매물, 호가 말고 <br>진짜 총투입비로 판단하세요</h1>
  <p class="lead">호가는 반쪽 가격표입니다. 관심 매물 하나를 남겨 주시면, 분담금·금융비까지 더한
    <b>‘진짜 총투입비’ 맞춤 리포트</b>를 출처와 함께 만들어 보내드립니다.</p>
  <div class="price">📄 매물 맞춤 리포트 <b>3만원</b> · 수동 발급</div>

  <div class="card">
    <form id="report-form" novalidate>
      <label for="f-complex">관심 단지명 <span class="req">*</span></label>
      <input type="text" id="f-complex" placeholder="예) 느티마을 3단지" autocomplete="off">
      <div class="err-msg" id="e-complex"></div>

      <label for="f-detail">평형 또는 호가 <span class="req">*</span></label>
      <input type="text" id="f-detail" placeholder="예) 전용 84㎡ / 호가 6.5억" autocomplete="off">
      <div class="hint">아는 만큼만 적어 주세요. 매물 특정에 씁니다.</div>
      <div class="err-msg" id="e-detail"></div>

      <label for="f-email">이메일 <span class="req">*</span></label>
      <input type="email" id="f-email" placeholder="report@example.com" autocomplete="email">
      <div class="hint">리포트·결제 안내를 이 주소로 보내드려요.</div>
      <div class="err-msg" id="e-email"></div>

      <label for="f-phone">휴대폰 <span style="color:var(--sub);font-weight:400">(선택)</span></label>
      <input type="tel" id="f-phone" placeholder="010-0000-0000" autocomplete="tel">
      <div class="err-msg" id="e-phone"></div>

      <label class="consent" for="f-consent">
        <input type="checkbox" id="f-consent">
        <span>유료(3만원) 맞춤 리포트임을 확인했으며, 신청 후 결제·발급 안내를 이메일로 받는 데 동의합니다. <span class="req">*</span></span>
      </label>
      <div class="err-msg" id="e-consent"></div>

      <button type="submit" class="btn" id="submit-btn">3만원 리포트 신청하기</button>
      <div class="form-msg" id="form-msg"></div>
    </form>
  </div>

  <p class="foot">지금은 신청만 받아요. 결제(3만원)와 리포트 발급은 담당자가 이메일로 안내드립니다.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ── Supabase 클라이언트 (익명 INSERT 전용 · 안전장치=RLS) ──
  var SUPABASE_URL = 'https://lynmnuftfybbegdxjfbz.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5bm1udWZ0ZnliYmVnZHhqZmJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0Njk3OTUsImV4cCI6MjA5OTA0NTc5NX0.66hZ9W29yoscoC8ibbUeHQluG8ecEo-nI5a8F19beGE';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var form = document.getElementById('report-form');
  var submitBtn = document.getElementById('submit-btn');
  var submitLabel = submitBtn.textContent;
  var msgEl = document.getElementById('form-msg');

  function setInvalid(id, bad){
    document.getElementById(id).classList.toggle('invalid', !!bad);
  }
  function setErr(id, text){ document.getElementById(id).textContent = text || ''; }
  function setFormMsg(text, ok){
    msgEl.textContent = text;
    msgEl.className = 'form-msg ' + (ok === null ? '' : ok ? 'ok' : 'err');
  }
  function isValidEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
  function isValidPhone(v){ return /^01[016789][-\s]?\d{3,4}[-\s]?\d{4}$/.test(v); }

  form.addEventListener('submit', function(e){
    e.preventDefault();

    var complex = document.getElementById('f-complex').value.trim();
    var detail  = document.getElementById('f-detail').value.trim();
    var email   = document.getElementById('f-email').value.trim();
    var phone   = document.getElementById('f-phone').value.trim();
    var consent = document.getElementById('f-consent').checked;

    var ok = true;
    // ① 필수값 검증 (한국어 메시지)
    setErr('e-complex', complex ? '' : '관심 단지명을 입력해 주세요.'); setInvalid('f-complex', !complex); if(!complex) ok = false;
    setErr('e-detail',  detail  ? '' : '평형 또는 호가를 입력해 주세요.'); setInvalid('f-detail', !detail); if(!detail) ok = false;

    if(!email){ setErr('e-email','이메일을 입력해 주세요.'); setInvalid('f-email',true); ok=false; }
    else if(!isValidEmail(email)){ setErr('e-email','이메일 형식이 올바르지 않아요.'); setInvalid('f-email',true); ok=false; }
    else { setErr('e-email',''); setInvalid('f-email',false); }

    if(phone && !isValidPhone(phone)){ setErr('e-phone','휴대폰 번호 형식이 올바르지 않아요.'); setInvalid('f-phone',true); ok=false; }
    else { setErr('e-phone',''); setInvalid('f-phone',false); }

    setErr('e-consent', consent ? '' : '유료 안내 동의가 필요해요.'); if(!consent) ok=false;

    if(!ok){ setFormMsg('', null); return; }

    // 연타 방지
    submitBtn.disabled = true;
    submitBtn.textContent = '신청 중…';
    setFormMsg('', null);

    // ② Supabase report_requests 테이블에 서버 저장 (익명 INSERT)
    sb.from('report_requests').insert({
      complex: complex,
      detail:  detail,
      email:   email,
      phone:   phone || null,
      consent: consent,
      ref:     (new URLSearchParams(location.search).get('ref') || 'report')
    }).then(function(res){
      submitBtn.disabled = false;
      submitBtn.textContent = submitLabel;

      // ③ 성공/실패 화면 반영 (한국어)
      if(res.error){
        setFormMsg('신청에 실패했어요. 잠시 후 다시 시도해 주세요.', false);
        return;
      }
      form.reset();
      setFormMsg('리포트 신청이 접수됐어요. 결제·진행 안내를 이메일로 보내드릴게요.', true);
      // 지불의사 측정용 전환 이벤트 (Umami)
      if(window.umami){ window.umami.track('report-request'); }
    }).catch(function(){
      submitBtn.disabled = false;
      submitBtn.textContent = submitLabel;
      setFormMsg('신청에 실패했어요. 잠시 후 다시 시도해 주세요.', false);
    });
  });
</script>
</body>
</html>
